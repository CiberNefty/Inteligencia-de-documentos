{% extends 'base.html' %}
{% block title %}Subida de Documentos{% endblock %}

{% block contenido %}
<h1>Subir documento</h1>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Subir</button>

    {% if error_documento %}
        <p style="color: red;"><strong>{{ error_documento }}</strong></p>
    {% endif%}
</form>
{% endblock %}
